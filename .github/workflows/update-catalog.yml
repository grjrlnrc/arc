name: Update resource catalog

on:
  push:
    paths:
      - "Resources/**"
      - "!Resources/catalog.json"
      - "scripts/generate-catalog.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate catalog
        run: node scripts/generate-catalog.mjs

      - name: Commit catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Resources/catalog.json"
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
          else
            git commit -m "Update Resources/catalog.json"
            git push
          fi
